addr: 127.0.0.1:9494
username: quote-genki
password: quote-genki
clientName: quote-genki
subscribes:
  - cmd: CmdSubAllType
    subAll: true
    spanIndex: 0
listenAddr: 127.0.0.1:9494
# default is None, means: not use backup
# backupConfig:
#   addr: localhost:9494
healthyConfig:
  # 500ms is default
  heartbeatInterval: 500ms
  # 3s is default
  heartbeatTimeout: 5s
  # 0 is default, means: not limit retry times
  retryTimes: 3
  # 3s is default
  retryInterval: 3s
channelConfig:
  # 8192 is default
  recvChanSize: 20000
  # 1024 is default
  sendChanSize: 20000
  # 1024 is default
  signalChanSize: 1024
bufferConfig:
  # parseFirst is default
  bufMode: parseFirst
  # 65535 is default
  maxUdpReadSize: 65535
  # 65535 is default
  maxUdpWriteSize: 65535
  # 16843790 is default, 16Mi
  maxStreamReadSize: 16843790
  # 16843790 is default, 16Mi
  maxStreamWriteSize: 16843790
  # 5 is default
  packetArrayInitSize: 5
timeoutConfig:
  request: 5s
  response: 5s
