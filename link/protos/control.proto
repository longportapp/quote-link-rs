syntax = "proto3";

package control;

message Heartbeat {
  int64 timestamp = 1;
}

message AuthRequest {
  AuthInfo auth_info = 1;
}

message AuthResponse {
  AuthInfo auth_info = 1;
}

message AuthInfo {
  string user_name = 1;
  string password = 2;
  string client_name = 3;
}

message SubscribeRequest {
  bool all = 1;
  repeated string counter_ids = 2;
  int64 span_index = 3;
}

//按标的订阅时返回未成功订阅的标的 用于重试
message SubscribeResponse {
  repeated string success = 1;
  repeated string failed = 2;
}

message UnsubscribeRequest {
  bool all = 1;
  repeated string counter_ids = 2;
  int64 span_index = 3;
}

message UnsubscribeResponse {
  repeated string success = 1;
  repeated string failed = 2;
}

message LinkError {
  uint64 code = 1;
  string msg = 2;
}
